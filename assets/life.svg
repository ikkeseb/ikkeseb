<svg xmlns="http://www.w3.org/2000/svg" width="840" height="60" viewBox="0 0 840 60" role="img" aria-labelledby="t">
  <!-- Conway's Game of Life: still lifes, period-2 oscillators (blinker, toad, beacon) and gliders.
       One generation = 0.4 s. No fonts, no scripts, no external resources. -->
  <title id="t">Conway's Game of Life: gliders crossing a field of oscillators and still lifes</title>
  <style>
    .walk { animation: walk 25.6s steps(16, end) infinite; }
    @keyframes walk { from { transform: translate(0, 0); } to { transform: translate(96px, 96px); } }
    .p { opacity: 0; animation: gen 1.6s steps(1, end) infinite; }
    .p0 { opacity: 1; }
    .p1 { animation-delay: -1.2s; } .p2 { animation-delay: -0.8s; } .p3 { animation-delay: -0.4s; }
    @keyframes gen { 0% { opacity: 1; } 25%, 100% { opacity: 0; } }
    .o0, .o1 { animation: osc 0.8s steps(1, end) infinite; }
    .o1 { opacity: 0; animation-delay: -0.4s; }
    @keyframes osc { 0% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .o1 { opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="1" height="1" fill="#8b949e" fill-opacity=".35"/></pattern>
    <clipPath id="field"><rect width="840" height="60"/></clipPath>
  </defs>
  <rect width="840" height="60" fill="url(#dots)"/>
