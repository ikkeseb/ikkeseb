<svg xmlns="http://www.w3.org/2000/svg" width="840" height="60" viewBox="0 0 840 60" role="img" aria-labelledby="t">
  <!-- Conway's Game of Life: still lifes, blinkers and three gliders. No fonts, no external resources. -->
  <title id="t">Conway's Game of Life: gliders crossing a field of still lifes</title>
  <style>
    .walk { animation: walk 38.4s steps(16, end) infinite; }
    @keyframes walk { from { transform: translate(0, 0); } to { transform: translate(96px, 96px); } }
    .p { opacity: 0; animation: gen 2.4s steps(1, end) infinite; }
    .p0 { opacity: 1; }
    .p1 { animation-delay: -1.8s; } .p2 { animation-delay: -1.2s; } .p3 { animation-delay: -0.6s; }
    @keyframes gen { 0% { opacity: 1; } 25%, 100% { opacity: 0; } }
    .blink { transform-box: fill-box; transform-origin: center; animation: flip 1.2s steps(1, end) infinite; }
    @keyframes flip { 0% { transform: rotate(0deg); } 50%, 100% { transform: rotate(90deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="1" height="1" fill="#8b949e" fill-opacity=".35"/></pattern>
    <clipPath id="field"><rect width="840" height="60"/></clipPath>
  </defs>
  <rect width="840" height="60" fill="url(#dots)"/>
